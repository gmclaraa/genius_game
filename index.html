<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/normalize.css@8.0.1/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=Bungee&family=Iceberg&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="game">
            <div class="gamepad gamepad-tl"></div>
            <div class="gamepad gamepad-tr"></div>
            <div class="gamepad gamepad-bl"></div>
            <div class="gamepad gamepad-br"></div>

            <div class="game__options">
                <h1 class="game__title">Genius<span class="reg">®</span></h1>

                <div class="gui">
                    <div class="group">
                        <div class="gui__counter">--</div>
                        <p class="gui__label">count</p>
                    </div><!-- .group -->

                    <div class="group">
                        <div class="gui__btn gui__btn--start"></div>
                        <p class="gui__label">start</p>
                    </div><!-- .group -->

                    <div class="group">
                        <div class="gui__led"></div>
                        <div class="gui__btn gui__btn--strict"></div>
                        <p class="gui__label">strict</p>
                    </div><!-- .group -->

                    <div class="group group-large">
                        <p class="gui__label gui__label--switch">on</p>
                        <div class="gui__btn-switch"></div>
                        <p class="gui__label gui__label--switch">off</p>
                    </div><!-- .group -->
                </div><!-- .gui -->
            </div><!-- .game__options -->
        </div><!-- .game -->
        <footer>@gmclaraa -2026</footer>
    </div><!-- .container -->

    <script src="./script.js"></script>
</body>

</html>
